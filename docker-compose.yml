services:
  edukit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edukit
    restart: unless-stopped
    # Variáveis de runtime (ANTHROPIC_API_KEY, MONGODB_URI, MONGODB_DB,
    # AUTH_SECRET). O ficheiro fica no servidor, fora da imagem e fora do Git.
    env_file:
      - .env.local
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
