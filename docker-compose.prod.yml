services:
  edukit:
    build:
      context: .
      dockerfile: Dockerfile
    image: edukit:latest
    container_name: edukit-prod
    restart: always
    env_file:
      - .env.local
    ports:
      - "3010:3010"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3010"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
